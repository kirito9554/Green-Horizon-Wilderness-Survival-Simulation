<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Horizon: Tropical Survival Colony</title>
    <meta name="description" content="A tactical tropical survival colony simulation focusing on exploration, camp logistics, crafting, and party management." />
    <meta property="og:title" content="Green Horizon: Tropical Survival Colony" />
    <meta property="og:description" content="A tactical tropical survival colony simulation focusing on exploration, camp logistics, crafting, and party management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Organic Edge & Worn Border SVG Filters for Game UI -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
      <defs>
        <!-- Fine subtle roughness for panels & modals: breaks straight computer lines into chiseled hand-carved edges -->
        <filter id="gh-rough-border" x="-2%" y="-2%" width="104%" height="104%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Medium rough edge for outer frames and heavy wood slabs -->
        <filter id="gh-rough-frame" x="-3%" y="-3%" width="106%" height="106%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="frameNoise" />
          <feDisplacementMap in="SourceGraphic" in2="frameNoise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
