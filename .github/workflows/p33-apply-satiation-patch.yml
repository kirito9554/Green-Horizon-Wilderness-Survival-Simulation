name: Apply P3.3 Satiation Patch

on:
  push:
    branches:
      - feature/predator-satiation-aware-hunting
    paths:
      - '.github/workflows/p33-apply-satiation-patch.yml'
      - 'scripts/apply-p33-satiation-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/predator-satiation-aware-hunting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply satiation-aware hunting patch
        run: python scripts/apply-p33-satiation-patch.py
      - name: Typecheck
        run: npm run lint
      - name: Run deterministic 90-day probe
        run: npx tsx scripts/predator-hunt-event-probe.ts --out=artifacts/predator-hunt-events
      - name: Commit P3.3 core change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/predatorDiscreteHuntingSystem.ts
          git commit -m "feat: make predator hunting satiation-aware"
          git push origin HEAD:feature/predator-satiation-aware-hunting
