name: Five-year Terrestrial Trophic Soak

on:
  push:
    paths:
      - 'src/data/spatial*.ts'
      - 'src/simulation/spatial/**'
      - 'src/types/spatial*.ts'
      - 'scripts/spatial-trophic-multiyear-soak.ts'
      - 'scripts/spatial-predator-p6-smoke.ts'
      - 'scripts/spatial-predator-p7-smoke.ts'
      - 'scripts/spatial-predator-p8-smoke.ts'
      - 'scripts/spatial-predator-p9-smoke.ts'
      - 'scripts/spatial-predator-p9-diagnostic.ts'
      - 'package.json'
      - '.github/workflows/trophic-soak.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  trophic-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: combined
            seed: spatial-trophic-soak-alpha
            gate: '1'
            p9: '0'
            rescue: '1'
          - mode: combined
            seed: spatial-trophic-soak-beta
            gate: '1'
            p9: '0'
            rescue: '1'
          # Research probes: retain the real births/deaths, disable external rescue,
          # and report ecological outcomes without claiming a survival PASS.
          - mode: combined
            seed: spatial-trophic-soak-alpha
            gate: '0'
            p9: '1'
            rescue: '0'
          - mode: combined
            seed: spatial-trophic-soak-beta
            gate: '0'
            p9: '1'
            rescue: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Predator P6 regression
        run: npm run test:spatial-predator-p6

      - name: Predator P7 energy accounting regression
        run: npm run test:spatial-predator-p7

      - name: Predator P8 intermittent-feeding/hunt-plan regression
        run: npm run test:spatial-predator-p8

      - name: Predator P9 bioenergetic-shadow regression
        run: npm run test:spatial-predator-p9

      - name: P9.6 30-day predator diagnostic
        env:
          SPATIAL_TROPHIC_SEED: ${{ matrix.seed }}
          P9_DAYS: '30'
          P9_ALT_DIET: '1'
          P9_SWITCHING: '1'
          P9_CALIBRATE: '1'
        run: npm run test:spatial-predator-p9-diagnostic

      - name: Five-year terrestrial trophic soak
        env:
          PREDATOR_P6_MODE: ${{ matrix.mode }}
          SPATIAL_TROPHIC_SEED: ${{ matrix.seed }}
          PREDATOR_P6_ASSERT: ${{ matrix.gate }}
          PREDATOR_P9_ACTIVE: ${{ matrix.p9 }}
          PREDATOR_NO_RESCUE: ${{ matrix.rescue == '0' && '1' || '0' }}
        run: npm run test:spatial-trophic-soak

      - name: Upload P9 shadow trophic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator-p9-shadow-${{ matrix.mode }}-${{ matrix.seed }}-p9${{ matrix.p9 }}-rescue${{ matrix.rescue }}
          path: artifacts/predator-p9-shadow-*.json
          if-no-files-found: warn

      - name: Upload P9.6 30-day diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator-p9.6-diagnostic-${{ matrix.seed }}
          path: artifacts/predator-p9.6-diagnostic-${{ matrix.seed }}-30d.json
          if-no-files-found: error
