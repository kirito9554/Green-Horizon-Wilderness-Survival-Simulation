name: Temporary Crocodile Demand Patch

on:
  push:
    branches:
      - feature/p5-coupled-one-year-gate
    paths:
      - scripts/tmp-croc-demand-patch.mjs
      - .github/workflows/tmp-croc-demand-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p5-coupled-one-year-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Crocodile demand calibration
        run: node scripts/tmp-croc-demand-patch.mjs
      - name: Typecheck patched tree
        run: npm run lint
      - name: Commit patched ecology
        run: |
          git config user.name "kirito9554"
          git config user.email "127989635+kirito9554@users.noreply.github.com"
          git add -A
          git commit -m "tune: calibrate crocodile maintenance demand"
          git push origin HEAD:feature/p5-coupled-one-year-gate
