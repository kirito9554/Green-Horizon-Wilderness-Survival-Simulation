name: Temporary P5 Five-Year Harness Patch

on:
  push:
    branches:
      - feature/p5-coupled-one-year-gate
    paths:
      - scripts/tmp-p5-five-year-patch.mjs
      - .github/workflows/tmp-p5-five-year-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p5-coupled-one-year-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply five-year harness patch
        run: node scripts/tmp-p5-five-year-patch.mjs
      - name: Typecheck patched tree
        run: npm run lint
      - name: Commit calibrated five-year harness
        run: |
          git config user.name "kirito9554"
          git config user.email "127989635+kirito9554@users.noreply.github.com"
          git add -A
          git commit -m "ci: extend coupled P5 gate through five years"
          git push origin HEAD:feature/p5-coupled-one-year-gate
