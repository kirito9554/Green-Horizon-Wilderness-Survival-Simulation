name: Predator Long-Run Diagnostics

on:
  pull_request:
    branches:
      - feature/predator-pressure-response
    paths:
      - 'scripts/predator-long-run-diagnostics.ts'
      - 'src/simulation/predatorHungerTelemetry.ts'
      - 'src/simulation/predatorPressureResponseSystem.ts'
      - 'src/simulation/ecologyPredatorSystem.ts'
      - 'src/simulation/longRunEcosystemSystem.ts'
      - '.github/workflows/predator-long-run-diagnostics.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: predator-long-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cancel stale P5 diagnostic runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const prNumber = context.payload.pull_request.number;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'predator-long-run-diagnostics.yml',
              event: 'pull_request',
              status: 'in_progress',
              per_page: 20,
            });

            for (const run of data.workflow_runs) {
              if (run.id === currentRunId) continue;
              const samePr = (run.pull_requests || []).some(pr => pr.number === prNumber);
              if (!samePr) continue;
              core.info(`Cancelling stale P5 run ${run.id}`);
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Run 1/5/20-year predator diagnostics
        run: npx tsx scripts/predator-long-run-diagnostics.ts --out=artifacts/predator-long-run
      - name: Upload predator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator-long-run-report
          path: artifacts/predator-long-run/predator-long-run-report.json
          if-no-files-found: warn
