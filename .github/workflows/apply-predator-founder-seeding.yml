name: Apply predator founder seeding once

on:
  push:
    branches: [feature/spatial-world-foundation-founder-work]
    paths:
      - '.github/workflows/apply-predator-founder-seeding.yml'
      - 'scripts/apply-predator-founder-seeding.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-world-foundation-founder-work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: node scripts/apply-predator-founder-seeding.mjs

      - name: Typecheck
        run: npm run lint

      - name: Founder-unit smoke
        run: npx tsx scripts/spatial-predator-founder-smoke.ts

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/spatial/spatialPredatorRuntime.ts scripts/spatial-predator-founder-smoke.ts
          git commit -m "Seed viable predator founder units"
          git push origin HEAD:feature/spatial-world-foundation-founder-work
