name: Predator Discrete Hunting

on:
  pull_request:
    branches:
      - feature/predator-long-run-diagnostics
    paths:
      - 'src/types/ecologySimulation.ts'
      - 'src/simulation/ecologyPredatorSystem.ts'
      - 'src/simulation/predatorDiscreteHuntingSystem.ts'
      - 'src/simulation/predatorPressureResponseSystem.ts'
      - 'scripts/predator-energy-throughput-probe.ts'
      - 'scripts/predator-hunt-event-probe.ts'
      - '.github/workflows/predator-discrete-hunting.yml'

concurrency:
  group: predator-discrete-hunting-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Run 90-day predator hunt event probe
        run: npx tsx scripts/predator-hunt-event-probe.ts --out=artifacts/predator-hunt-events
      - name: Upload predator hunt event probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predator-hunt-event-report
          path: artifacts/predator-hunt-events/predator-hunt-event-report.json
          if-no-files-found: warn
