name: Typecheck, Simulation Smoke, and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Deep production smoke test
        run: npm run test:production

      - name: Canonical main-world POI migration smoke test
        run: npm run test:poi-migration

      - name: Spatial world geometry and route smoke test
        run: npm run test:spatial-world

      - name: Metric spatial fauna community smoke test
        run: npm run test:spatial-fauna

      - name: Living spatial fauna cohort runtime smoke test
        run: npm run test:spatial-fauna-runtime

      - name: Shared spatial fauna competition smoke test
        run: npm run test:spatial-fauna-competition

      - name: Area-scaled spatial fauna resource pool smoke test
        run: npm run test:spatial-fauna-resources

      - name: Predator founder-unit smoke test
        run: npm run test:spatial-predator-founders

      - name: Predator P6 breeding-retention/recovery smoke test
        run: npm run test:spatial-predator-p6

      - name: Predator P7 energy-accounting smoke test
        run: npm run test:spatial-predator-p7

      - name: Predator P8 intermittent-feeding/hunt-plan smoke test
        run: npm run test:spatial-predator-p8

      - name: Predator P9 bioenergetic-shadow smoke test
        run: npm run test:spatial-predator-p9

      - name: Full spatial trophic ecosystem smoke test
        run: npm run test:spatial-trophic

      - name: World ecology foundation smoke test
        run: npm run test:ecology

      - name: Wild herbivore and omnivore ecology smoke test
        run: npm run test:ecology-fauna

      - name: Predator and prey balance smoke test
        run: npm run test:ecology-predators

      - name: Aquatic ecology foundation smoke test
        run: npm run test:ecology-aquatic

      - name: Aquatic food-web smoke test
        run: npm run test:ecology-aquatic-food

      - name: Terrestrial ecology scale smoke test
        run: npm run test:ecology-terrestrial-scale

      - name: World hydrology foundation smoke test
        run: npm run test:hydrology

      - name: Surface-water hydrology smoke test
        run: npm run test:hydrology-surface

      - name: Player water-management smoke test
        run: npm run test:hydrology-management

      - name: Living-system hydrology integration smoke test
        run: npm run test:hydrology-living

      - name: Aquatic-ready hydrology smoke test
        run: npm run test:hydrology-aquatic

      - name: Environmental scale and human-impact smoke test
        run: npm run test:environment-scale

      - name: Spatial building smoke test
        run: npm run test:building

      - name: Structure lifecycle smoke test
        run: npm run test:structure

      - name: Structure repair and modification smoke test
        run: npm run test:structure-work

      - name: Storage simulation smoke test
        run: npm run test:storage

      - name: Storage modification smoke test
        run: npm run test:storage-mods

      - name: Storage network optimizer smoke test
        run: npm run test:storage-network

      - name: Living agriculture smoke test
        run: npm run test:agriculture

      - name: Production build
        run: npm run build
