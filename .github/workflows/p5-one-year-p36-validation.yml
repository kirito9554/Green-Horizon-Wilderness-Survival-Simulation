name: P3.7 Predator Demography Audit

on:
  push:
    branches:
      - validation/p5-one-year-p36

permissions:
  contents: read

concurrency:
  group: p37-predator-demography-audit
  cancel-in-progress: true

jobs:
  audit-demography:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instrument predator demography
        run: python scripts/p37-demography-audit-patch.py
      - name: Typecheck instrumented code
        run: npm run lint
      - name: Prepare one-year-only diagnostic harness
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p5-coupled-fast-gate.ts')
          s = p.read_text()
          old = "if (calibrationFailures.length === 0 && gateFailures.length === 0) {"
          if old not in s:
              raise SystemExit('five-year gate condition not found')
          s = s.replace(old, "if (false && calibrationFailures.length === 0 && gateFailures.length === 0) {", 1)
          old_exit = "else if (gateFailures.length > 0 || fiveYearGateFailures.length > 0 || !fiveYear) process.exitCode = 2;"
          if old_exit not in s:
              raise SystemExit('gate exit condition not found')
          s = s.replace(old_exit, "else if (gateFailures.length > 0) process.exitCode = 2;", 1)
          p.write_text(s)
          PY
      - name: Run one-year demography audit (3h aquatic)
        run: |
          mkdir -p artifacts/p37-demography-audit
          npx tsx scripts/p5-coupled-fast-gate.ts --coarse-aquatic-substep=180 --out=artifacts/p37-demography-audit | tee artifacts/p37-demography-audit/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p37-demography-audit
          path: artifacts/p37-demography-audit
          if-no-files-found: warn
