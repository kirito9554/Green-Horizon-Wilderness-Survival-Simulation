name: P3.5 Energy-Aware Prey Selection Patch

on:
  push:
    branches:
      - feature/p35-energy-aware-prey-selection

permissions:
  contents: write

concurrency:
  group: p35-energy-aware-selection-patch
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply P3.5 patch
        run: node scripts/apply-p35-energy-aware-prey-selection.mjs
      - name: Typecheck
        run: npm run lint
      - name: Run 90-day hunt diagnostic
        run: npx tsx scripts/predator-hunt-event-probe.ts --out=artifacts/p35-prey-selection
      - name: Commit core change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/predatorDiscreteHuntingSystem.ts
          git commit -m "tune: prioritize medium and large prey by meal value"
          git push origin HEAD:feature/p35-energy-aware-prey-selection
