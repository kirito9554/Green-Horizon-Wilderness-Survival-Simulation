name: P3.7 Apply and Validate Resource Model

on:
  push:
    branches:
      - feature/p37-diet-aware-demography

permissions:
  contents: write

concurrency:
  group: p37-apply-resource-model
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply P3.7 resource model
        run: python scripts/p37-apply-resource-model.py
      - name: Apply P3.7 aquatic refugia
        run: python scripts/p37-apply-aquatic-refugia.py
      - name: Typecheck patched source
        run: npm run lint
      - name: Prepare one-year-only coupled gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p5-coupled-fast-gate.ts')
          s = p.read_text()
          old = "if (calibrationFailures.length === 0 && gateFailures.length === 0) {"
          if old not in s:
              raise SystemExit('five-year gate condition not found')
          s = s.replace(old, "if (false && calibrationFailures.length === 0 && gateFailures.length === 0) {", 1)
          old_exit = "else if (gateFailures.length > 0 || fiveYearGateFailures.length > 0 || !fiveYear) process.exitCode = 2;"
          if old_exit not in s:
              raise SystemExit('gate exit condition not found')
          s = s.replace(old_exit, "else if (gateFailures.length > 0) process.exitCode = 2;", 1)
          p.write_text(s)
          PY
      - name: Run P3.7 coupled one-year gate
        run: npx tsx scripts/p5-coupled-fast-gate.ts --coarse-aquatic-substep=180 --out=artifacts/p37-one-year
      - name: Restore validation harness and verify diff
        run: |
          git checkout -- scripts/p5-coupled-fast-gate.ts
          git diff --check
          git status --short
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/ecologyPredatorSystem.ts src/simulation/predatorDiscreteHuntingSystem.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: align predator demography with reachable resources"
            git push origin HEAD:feature/p37-diet-aware-demography
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p37-one-year-report
          path: artifacts/p37-one-year/p5-coupled-fast-report.json
          if-no-files-found: warn
