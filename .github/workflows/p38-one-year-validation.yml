name: P3.8 One-Year Coupled Validation

on:
  push:
    branches:
      - validation/p38-one-year-meal-cadence

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Prepare one-year-only gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p5-coupled-fast-gate.ts')
          s = p.read_text()
          old = "if (calibrationFailures.length === 0 && gateFailures.length === 0) {"
          if old not in s:
              raise SystemExit('five-year gate condition not found')
          s = s.replace(old, "if (false && calibrationFailures.length === 0 && gateFailures.length === 0) {", 1)
          old_exit = "else if (gateFailures.length > 0 || fiveYearGateFailures.length > 0 || !fiveYear) process.exitCode = 2;"
          if old_exit not in s:
              raise SystemExit('gate exit condition not found')
          s = s.replace(old_exit, "else if (gateFailures.length > 0) process.exitCode = 2;", 1)
          p.write_text(s)
          PY
      - name: Run P3.8 one-year gate
        run: npx tsx scripts/p5-coupled-fast-gate.ts --coarse-aquatic-substep=180 --out=artifacts/p38-one-year
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p38-one-year-report
          path: artifacts/p38-one-year/p5-coupled-fast-report.json
          if-no-files-found: warn
