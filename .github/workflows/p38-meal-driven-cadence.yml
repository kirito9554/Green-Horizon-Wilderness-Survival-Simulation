name: P3.8 Meal-Driven Hunt Cadence

on:
  push:
    branches:
      - feature/p38-meal-driven-hunt-cadence

permissions:
  contents: write

concurrency:
  group: p38-meal-driven-cadence
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply P3.8 cadence patch
        run: python scripts/p38-apply-meal-driven-cadence.py
      - name: Typecheck patched source
        run: npm run lint
      - name: Prepare 180-day hunt probe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/predator-hunt-event-probe.ts')
          s = p.read_text()
          old = 'const VALIDATION_DAYS = 90;'
          if old not in s:
              raise SystemExit('90-day validation constant not found')
          p.write_text(s.replace(old, 'const VALIDATION_DAYS = 180;', 1))
          PY
      - name: Run 180-day P3.8 probe
        run: npx tsx scripts/predator-hunt-event-probe.ts --out=artifacts/p38-hunt-cadence
      - name: Restore probe and verify diff
        run: |
          git checkout -- scripts/predator-hunt-event-probe.ts
          git diff --check
          git status --short
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/ecologyPredatorSystem.ts src/simulation/predatorDiscreteHuntingSystem.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: make predator hunt cadence meal-driven"
            git push origin HEAD:feature/p38-meal-driven-hunt-cadence
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p38-hunt-cadence-report
          path: artifacts/p38-hunt-cadence/**
          if-no-files-found: warn
