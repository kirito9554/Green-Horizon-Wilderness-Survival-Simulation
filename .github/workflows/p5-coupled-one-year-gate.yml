name: P5 Coupled One-Year Gate

on:
  push:
    branches:
      - feature/p5-coupled-one-year-gate
  pull_request:
    branches:
      - feature/aquatic-detrital-food-web-p34-impl
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-coupled-one-year-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Run coupled terrestrial + aquatic one-year gate
        run: npx tsx scripts/p5-coupled-one-year-gate.ts --out=artifacts/p5-coupled-one-year
      - name: Upload one-year gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-coupled-one-year-report
          path: artifacts/p5-coupled-one-year/p5-coupled-one-year-report.json
          if-no-files-found: warn
