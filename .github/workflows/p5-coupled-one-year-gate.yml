name: P5 Coupled Calibrated 1Y-5Y Gate

on:
  push:
    branches:
      - feature/p5-coupled-one-year-gate
  pull_request:
    branches:
      - feature/aquatic-detrital-food-web-p34-impl
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-coupled-calibrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Run calibrated coupled one-year and five-year gate
        run: npx tsx scripts/p5-coupled-fast-gate.ts --coarse-aquatic-substep=360 --out=artifacts/p5-coupled-fast
      - name: Upload calibrated gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-coupled-fast-report
          path: artifacts/p5-coupled-fast/p5-coupled-fast-report.json
          if-no-files-found: warn
